# =====================================================================
#  Copie este archivo como config.properties y complete sus datos.
#  config.properties NO se sube a GitHub (está en .gitignore).
# =====================================================================

# --- Lectura de correos (POP3) ---
pop3.host=mail.tecnoweb.org.bo
pop3.puerto=110
pop3.usuario=grupoXXsa
pop3.password=CAMBIAR

# --- Envío de respuestas (SMTP) ---
# Dirección a la que los usuarios envían los comandos (va como Reply-To en las respuestas)
correo.buzon=grupoXXsa@tecnoweb.org.bo

smtp.host=mail.tecnoweb.org.bo
smtp.puerto=25
# ninguna | cram-md5 | login | plain   (tecnoweb ofrece CRAM-MD5)
smtp.auth=ninguna
# true = SSL implícito (ej: Gmail smtp.gmail.com:465 con smtp.auth=login y contraseña de aplicación)
smtp.ssl=false
smtp.usuario=grupoXXsa
smtp.password=CAMBIAR
smtp.remitente=grupoXXsa@tecnoweb.org.bo
smtp.nombre=Sistema Carrera Administración - Grupo XXSA

# --- Base de datos PostgreSQL ---
bd.host=db.tecnoweb.org.bo
bd.puerto=5432
bd.nombre=db_grupoXXsa
bd.usuario=grupoXXsa
bd.password=CAMBIAR

# --- Demonio ---
demonio.intervalo_segundos=10
demonio.borrar_procesados=true
correo.timeout_segundos=90

# --- Respuestas y seguridad ---
respuesta.max_filas=200
# true = solo correos registrados en la tabla users (activos) pueden usar INS/MOD/ELI
seguridad.solo_usuarios_registrados=false

# --- Logs (access.log y error.log) ---
logs.directorio=logs
